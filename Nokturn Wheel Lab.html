header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--scar)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px}
.brand .lmw{width:120px;filter:drop-shadow(0 0 1px #000) drop-shadow(0 2px 0 #000)}
.brand b{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;color:var(--peep);font-weight:400;text-transform:uppercase}
.tbtn{font-family:var(--f-data);font-size:11px;text-transform:uppercase;letter-spacing:.12em;background:none;border:1px solid var(--scar);color:var(--chrome);padding:8px 10px;cursor:pointer}
.tbtn:hover{border-color:var(--peep);color:var(--peep)}
.tbtn[aria-pressed="true"]{background:var(--peep);border-color:var(--peep);color:var(--ink)}

.app{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);min-height:calc(100% - 60px)}
.view{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));touch-action:none;cursor:grab;
  background:radial-gradient(circle at 50% 50%,#1d171c 0,var(--ink) 65%)}
.view canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:16px;bottom:12px;font-family:var(--f-data);font-size:11px;color:var(--ash);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.viewbtns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:6px}
.panel{border-left:1px solid var(--scar);background:var(--soot);padding-block:8px 40px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .view{height:46vh;z-index:5;border-bottom:1px solid var(--scar)}
  .panel{border-left:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand .lmw{width:96px}
}
h2{font-family:var(--f-bio);font-weight:400;text-transform:uppercase;letter-spacing:.03em;font-size:20px;margin:0}
.grp{border-bottom:1px dashed var(--scar);padding-block:16px;display:flex;flex-direction:column;gap:12px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp-h span{font-family:var(--f-data);font-size:10px;color:var(--ash);letter-spacing:.14em;text-transform:uppercase}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.ctl label{font-size:14px}
.ctl output{font-family:var(--f-data);font-size:12px;color:var(--peep);font-variant-numeric:tabular-nums;text-align:right}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--peep);height:22px;margin:0}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--scar);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--peep);box-shadow:0 0 0 2px var(--ink) inset}
.sw input[type=color]{width:34px;height:30px;border:1px solid var(--scar);background:none;padding:0;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:14px;min-width:72px}
textarea{width:100%;min-height:72px;resize:vertical;font-family:var(--f-data);font-size:11px;background:var(--ink);color:var(--chrome);border:1px solid var(--scar);padding:8px;word-break:break-all}
.cta{font-family:var(--f-data);font-size:12px;text-transform:uppercase;letter-spacing:.14em;background:var(--chrome);color:var(--ink);border:0;padding:11px 14px;cursor:pointer}
.cta:hover{background:var(--peep)}
.msg{font-family:var(--f-data);font-size:11px;color:var(--peep);min-height:1.4em;margin:0}
.note{color:var(--ash);font-size:13px;margin:0}
</style>

<header>
  <div class="bar">
    <div class="brand"><div class="lmw"><span class="lm"></span></div><b>Wheel Lab</b></div>
    <div class="row">
      <button class="tbtn" id="rand" type="button">Zufall</button>
      <button class="tbtn" id="reset" type="button">Reset</button>
    </div>
  </div>
</header>

<div class="app">
  <div class="view" id="view">

      <button class="tbtn" id="spin" type="button" aria-pressed="true">Dreht</button>

  </div>

  <div class="panel" id="panel">

      <div class="row">
        <button class="cta" id="copy" type="button">Code kopieren</button>

      </div>

    </div>
  </div>
</div>

    ['bend','Schwung',-.35,.35,.01,v=>Math.round(v*100)],
    ['rnd','Rundung der Fenster',.02,.1,.005,v=>Math.round(v*100)],
  ]],
  ['Face','Tiefe und Grösse',[
    ['rin','Nabe Radius',.18,.4,.005,v=>Math.round(v*100)],
    ['rout','Fenster bis',.55,.76,.005,v=>Math.round(v*100)],
    ['cc','Konkav',0,.35,.01,v=>Math.round(v*100)],
  ]],
  ['Lippe','Step Lip',[
    ['fr','Face-Grösse (kleiner = breitere Lippe)',.66,.88,.005,v=>Math.round(v*100)],
    ['lip','Lippentiefe',.06,.5,.01,v=>Math.round(v*100)],
  ]],
  ['Schrauben','Pierce Bolts und Muttern',[
    ['bolts','Pierce Bolts',0,64,1,v=>v],
    ['lugs','Radmuttern',4,6,1,v=>v],
    ['pcd','Lochkreis',.16,.3,.005,v=>Math.round(v*100)],
  ]],
];
const FACE_COL=['#d9dae0','#f4f4f6','#5a5860','#1c1b1f','#c9b27a','#9b6b43','#ff8fc4','#c4123a'];
const LIP_COL=['#ffffff','#1c1b1f','#d4af37','#ff8fc4'];
const CAP_COL=['#1a171c','#d9dae0','#d4af37','#ff8fc4'];

let S={...DEF};
try{const sv=JSON.parse(localStorage.getItem('nkt-wheel')||'null');if(sv)S={...DEF,...sv}}catch(e){}

/* ---------- UI ---------- */
$('presets').innerHTML=Object.keys(PRESETS).map(k=>`<button class="tbtn" type="button" data-p="${k}">${k}</button>`).join('');
$('presets').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;S={...DEF,...PRESETS[b.dataset.p]};syncUI();rebuild()};

function swatchRow(key,cols,label){
  return `<div class="row"><span class="lbl">${label}</span><div class="sw" data-k="${key}">${cols.map(c=>`<button type="button" style="background:${c}" data-c="${c}" aria-label="${label} ${c}"></button>`).join('')}<input type="color" id="cc-${key}" aria-label="${label} eigene Farbe"></div></div>`;
}
function seg(key,opts,label){
  return `<div class="row"><span class="lbl">${label}</span>${opts.map(([v,t])=>`<button class="tbtn" type="button" data-k="${key}" data-v="${v}">${t}</button>`).join('')}</div>`;
}
let html='';
for(const [h,sub,ctrls] of GROUPS){
  html+=`<div class="grp"><div class="grp-h"><h2>${h}</h2><span>${sub}</span></div>`+
    ctrls.map(([k,l,mi,ma,st])=>`<div class="ctl"><label for="r-${k}">${l}</label><output id="o-${k}"></output><input type="range" id="r-${k}" min="${mi}" max="${ma}" step="${st}"></div>`).join('')+`</div>`;
}
html+=`<div class="grp"><div class="grp-h"><h2>Farbe</h2><span>Finish</span></div>
  ${swatchRow('face',FACE_COL,'Face')}
  ${seg('fin',[['polish','Poliert'],['satin','Satin'],['matte','Matt']],'Face Finish')}
  ${swatchRow('lipc',LIP_COL,'Lippe')}
  ${seg('lipf',[['polish','Poliert'],['satin','Satin'],['matte','Matt']],'Lippe Finish')}
  ${swatchRow('boltc',['#ffffff','#1c1b1f','#d4af37','#ff8fc4'],'Bolts')}
</div>
<div class="grp"><div class="grp-h"><h2>Center Cap</h2><span>Mitte</span></div>
  ${seg('cap',[['dome','Kuppel'],['flat','Flach'],['open','Offen']],'Form')}
  ${swatchRow('capc',CAP_COL,'Farbe')}
</div>`;
$('controls').innerHTML=html;

const FMT={};GROUPS.forEach(g=>g[2].forEach(c=>FMT[c[0]]=c[5]));
function syncUI(){
  for(const k in FMT){const r=$('r-'+k);if(r){r.value=S[k];$('o-'+k).textContent=FMT[k](S[k])}}
  document.querySelectorAll('.sw').forEach(w=>{const k=w.dataset.k;w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c.toLowerCase()===S[k].toLowerCase()));$('cc-'+k).value=S[k]});
  document.querySelectorAll('button[data-v]').forEach(b=>b.setAttribute('aria-pressed',S[b.dataset.k]===b.dataset.v));
}
$('controls').addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='range'){const k=t.id.slice(2);S[k]=+t.value;$('o-'+k).textContent=FMT[k](S[k]);rebuild()}
  if(t.type==='color'){S[t.id.slice(3)]=t.value;syncUI();rebuild()}
});
$('controls').addEventListener('click',e=>{
  const c=e.target.closest('.sw button');if(c){S[c.parentNode.dataset.k]=c.dataset.c;syncUI();rebuild();return}
  const v=e.target.closest('button[data-v]');if(v){S[v.dataset.k]=v.dataset.v;syncUI();rebuild()}
});
$('reset').onclick=()=>{S={...DEF};syncUI();rebuild()};
$('rand').onclick=()=>{
  const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  S={...DEF,n:pick([5,5,5,6,7,8,10]),w0:R(.06,.18),w1:R(.05,.17),sw:Math.random()<.5?0:R(-.4,.4),bend:Math.random()<.6?0:R(-.2,.2),
    rnd:R(.03,.08),rin:R(.22,.34),rout:R(.62,.74),cc:R(0,.28),fr:R(.7,.84),lip:R(.12,.42),bolts:pick([0,30,40,45,50]),
    face:pick(FACE_COL),fin:pick(['polish','satin','matte']),lipc:pick(LIP_COL),capc:pick(CAP_COL),cap:pick(['dome','flat','open'])};
  syncUI();rebuild();
};

/* code */
const enc=o=>'NKT1.'+btoa(JSON.stringify(Object.fromEntries(Object.entries(o).map(([k,v])=>[k,typeof v==='number'?+v.toFixed(3):v]))));
function updateCode(){$('code').value=enc(S);try{localStorage.setItem('nkt-wheel',JSON.stringify(S))}catch(e){}}
$('copy').onclick=()=>{
  const ta=$('code');
  navigator.clipboard.writeText(ta.value).then(()=>{$('msg').textContent='Kopiert. Jetzt im Chat einfügen.'}).catch(()=>{ta.focus();ta.select();$('msg').textContent='Text ist markiert, bitte manuell kopieren.'});
};
$('load').onclick=()=>{
  try{const v=$('code').value.trim().replace(/^NKT1\./,'');S={...DEF,...JSON.parse(atob(v))};syncUI();rebuild();$('msg').textContent='Code geladen.'}
  catch(e){$('msg').textContent='Der Code ist unvollständig. Kopier ihn nochmal komplett, inklusive NKT1.'}
};

/* ---------- 3D ---------- */
const view=$('view');
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputEncoding=THREE.sRGBEncoding;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.1;
view.prepend(r.domElement);
const scene=new THREE.Scene();
(function(){const pm=new THREE.PMREMGenerator(r),s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,30),new THREE.MeshBasicMaterial({color:0x060507,side:THREE.BackSide})));
  const L=(w,h,c,k,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m)};
  L(14,1.4,0xffffff,4,0,7,4);L(1.2,14,0xffffff,3,-8,0,5);L(1.2,12,0xffd6ea,2.5,8,1,2);L(10,4,0xff6fae,1.6,0,-7,-3);L(4,4,0xffffff,2,4,4,-8);L(16,.5,0xffffff,5,0,-2,9);
  scene.environment=pm.fromScene(s,.03).texture;pm.dispose()})();
scene.add(new THREE.AmbientLight(0xffffff,.35));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,4,5);scene.add(dl);
const pl=new THREE.PointLight(0xff8fc4,2,14);pl.position.set(-3,-2,3);scene.add(pl);
const cam=new THREE.PerspectiveCamera(30,1,.1,60);cam.position.set(0,0,5.4);
const orbit=new THREE.Group();scene.add(orbit);
let wheel=null;

const FIN={polish:[1,.07],satin:[.9,.3],matte:[.35,.68]};
const mat=(c,f,side)=>new THREE.MeshStandardMaterial({color:c,metalness:FIN[f][0],roughness:FIN[f][1],side:side||THREE.FrontSide});
const P2=(rr,t)=>new THREE.Vector2(rr*Math.cos(t),rr*Math.sin(t));
const chaikin=(pts,n)=>{for(let k=0;k<n;k++){const o=[];for(let q=0;q<pts.length;q++){const A=pts[q],B=pts[(q+1)%pts.length];o.push(new THREE.Vector2(.75*A.x+.25*B.x,.75*A.y+.25*B.y),new THREE.Vector2(.25*A.x+.75*B.x,.25*A.y+.75*B.y))}pts=o}return pts};
function resample(pts,step){
  const out=[];let acc=0;
  for(let i=0;i<pts.length;i++){const A=pts[i],B=pts[(i+1)%pts.length],L=A.distanceTo(B);
    let d=-acc;while(d+step<=L){d+=step;out.push(A.clone().lerp(B,d/L))}acc=L-d}
  return out.length>=6?out:pts;
}
const arcPts=(rr,t0,t1)=>{let dt=t1-t0;while(dt<0)dt+=Math.PI*2;const k=Math.max(2,Math.ceil(rr*dt/.01)),o=[];for(let q=0;q<k;q++)o.push(P2(rr,t0+dt*q/k));return o};
const ang=v=>Math.atan2(v.y,v.x);

function build(S){
  const g=new THREE.Group(), N=S.n, gap=Math.PI*2/N, R=S.fr;
  const rOut=Math.min(S.rout,R-.05), rIn=Math.min(S.rin,rOut-.14);
  const w0=Math.min(S.w0,rIn*Math.sin(gap/2)*.88), w1=Math.min(S.w1,rOut*Math.sin(gap/2)*.88);
  const front=.3, faceFront=front-S.lip;
  const zf=rr=>faceFront-S.cc*Math.pow(Math.max(0,1-rr/R),1.5);
  const rotX=geo=>{geo.rotateX(Math.PI/2);return geo};

  // Face: Ring + Nabe + einzelne Speichen (kann sich nicht mehr verknoten)
  const span=rOut-rIn, kf=Math.max(.015,S.rnd)/span;
  const W=t=>{t=Math.min(1,Math.max(0,t));return w0+(w1-w0)*t+S.rnd*(Math.exp(-t/kf)+Math.exp(-(1-t)/kf))};
  const C=(a,t)=>P2(rIn+span*t,a+S.sw*t+S.bend*Math.sin(Math.PI*Math.min(1,Math.max(0,t))));
  const ext=d=>({depth:d,bevelEnabled:true,bevelThickness:.04,bevelSize:.02,bevelSegments:3,curveSegments:96});
  const faceM=mat(S.face,S.fin);
  // Konkav biegen und Normalen analytisch mitdrehen, damit keine Facetten-Striche entstehen
  const addFace=(geo,dz)=>{const pos=geo.attributes.position,nor=geo.attributes.normal,v=new THREE.Vector3();
    for(let k=0;k<pos.count;k++){const x=pos.getX(k),y=pos.getY(k),rr=Math.min(R,Math.hypot(x,y));
      pos.setZ(k,pos.getZ(k)-S.cc*Math.pow(1-rr/R,1.5));
      const dh=rr>1e-4&&rr<R?S.cc*1.5*Math.sqrt(1-rr/R)/R/rr:0, hx=dh*x, hy=dh*y;
      v.set(nor.getX(k),nor.getY(k),nor.getZ(k));v.set(v.x-hx*v.z,v.y-hy*v.z,v.z).normalize();nor.setXYZ(k,v.x,v.y,v.z)}
    nor.needsUpdate=true;const m=new THREE.Mesh(geo,faceM);m.position.z=faceFront-.1+dz;g.add(m)};
  const ringS=new THREE.Shape();ringS.absarc(0,0,R,0,Math.PI*2,false);
  const hole=new THREE.Path();hole.absarc(0,0,rOut,0,Math.PI*2,true);ringS.holes.push(hole);
  addFace(new THREE.ExtrudeGeometry(ringS,ext(.06)),0);
  const hubS=new THREE.Shape();hubS.absarc(0,0,rIn,0,Math.PI*2,false);
  addFace(new THREE.ExtrudeGeometry(hubS,ext(.06)),0);
  const tA=-Math.min(.25,.05/span), tB=1+Math.min(.25,.035/span), K=48;
  for(let i=0;i<N;i++){
    const a=i*gap,L=[],Rr=[];
    for(let k=0;k<=K;k++){const t=tA+(tB-tA)*k/K,p=C(a,t),q=C(a,t+.01),p0=C(a,t-.01),
      d=q.clone().sub(p0).normalize(),n=new THREE.Vector2(-d.y,d.x),w=W(t);
      L.push(p.clone().addScaledVector(n,w));Rr.push(p.clone().addScaledVector(n,-w))}
    const sp=new THREE.Shape([...L,...Rr.reverse()]);
    addFace(new THREE.ExtrudeGeometry(sp,ext(.056)),-.004);
  }

  // Lippe, Bett
  const lipM=mat(S.lipc,S.lipf), lipD=mat(S.lipc,S.lipf,THREE.DoubleSide);
  const step=new THREE.Mesh(new THREE.RingGeometry(R,1,160),lipM);step.position.z=front;g.add(step);
  const edgeT=new THREE.Mesh(new THREE.TorusGeometry(1,.035,16,160),lipM);edgeT.position.z=front;g.add(edgeT);
  const wall=new THREE.Mesh(rotX(new THREE.CylinderGeometry(R,R,S.lip,128,1,true)),lipD);wall.position.z=front-S.lip/2;g.add(wall);
  const barrelM=new THREE.MeshStandardMaterial({color:0xbdbdc4,metalness:1,roughness:.3,side:THREE.DoubleSide});
  const barrel=new THREE.Mesh(rotX(new THREE.CylinderGeometry(.99,.99,.75,128,1,true)),barrelM);barrel.position.z=front-.375;g.add(barrel);
  const back=new THREE.Mesh(new THREE.TorusGeometry(1,.03,12,160),barrelM);back.position.z=front-.75;g.add(back);

  // Pierce Bolts
  const bM=mat(S.boltc,'polish'), br=(rOut+R)/2+.005;
  if(S.bolts>0){const bg=rotX(new THREE.CylinderGeometry(.016,.016,.03,6));
    for(let k=0;k<S.bolts;k++){const t=k/S.bolts*Math.PI*2,m=new THREE.Mesh(bg,bM);m.position.set(Math.cos(t)*br,Math.sin(t)*br,zf(br)+.012);m.rotation.z=t;g.add(m)}}

  // Radmuttern, symmetrisch: zwischen den Speichen wenn Anzahl passt
  const lugM=mat('#cfcfd4','polish'), lg=rotX(new THREE.CylinderGeometry(.03,.03,.07,6)), seat=rotX(new THREE.CylinderGeometry(.038,.045,.02,24));
  const off=(N%S.lugs===0||S.lugs%N===0)?gap/2:0;
  for(let k=0;k<S.lugs;k++){const t=k/S.lugs*Math.PI*2+off,x=Math.cos(t)*S.pcd,y=Math.sin(t)*S.pcd,z=zf(S.pcd);
    const nut=new THREE.Mesh(lg,lugM);nut.position.set(x,y,z+.04);nut.rotation.z=t;g.add(nut);
    const se=new THREE.Mesh(seat,mat('#2a2329','satin'));se.position.set(x,y,z+.005);g.add(se)}

  // Center Cap
  const z0=zf(0), capM=mat(S.capc,'polish');
  if(S.cap==='dome'){const d=new THREE.Mesh(new THREE.SphereGeometry(.12,48,16,0,Math.PI*2,0,Math.PI/2),capM);d.rotation.x=Math.PI/2;d.scale.set(1,.45,1);d.position.z=z0+.01;g.add(d)}
  if(S.cap==='flat'){const f=new THREE.Mesh(rotX(new THREE.CylinderGeometry(.12,.125,.05,64)),capM);f.position.z=z0+.03;g.add(f)}
  if(S.cap==='open'){const h=new THREE.Mesh(new THREE.CircleGeometry(.09,64),new THREE.MeshStandardMaterial({color:0x050405,roughness:1}));h.position.z=z0+.002;g.add(h)}
  const ring=new THREE.Mesh(new THREE.TorusGeometry(S.cap==='open'?.095:.125,.012,12,64),mat('#ffffff','polish'));ring.position.z=z0+(S.cap==='flat'?.055:.012);g.add(ring);
  return g;
}

function dispose(o){o.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()})}
let pending=false;
function rebuild(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;
  const rotZ=wheel?wheel.rotation.z:0;if(wheel){orbit.remove(wheel);dispose(wheel)}
  try{wheel=build(S)}catch(e){wheel=new THREE.Group();$('msg').textContent='Diese Kombination geht nicht auf. Schieb einen Regler etwas zurück.'}
  wheel.rotation.z=rotZ;orbit.add(wheel);updateCode()})}

function size(){const w=view.clientWidth,h=view.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w/h<1?7.2:5.4;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(view);size();

let spin=true,ry=-.35,rx=.12,tRy=ry,tRx=rx,drag=null;
$('spin').onclick=e=>{spin=!spin;e.currentTarget.setAttribute('aria-pressed',spin);e.currentTarget.textContent=spin?'Dreht':'Steht'};
$('front').onclick=()=>{tRy=0;tRx=0};
view.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,ry:tRy,rx:tRx};view.setPointerCapture(e.pointerId);view.style.cursor='grabbing'});
view.addEventListener('pointermove',e=>{if(!drag)return;tRy=drag.ry+(e.clientX-drag.x)/150;tRx=Math.max(-1.2,Math.min(1.2,drag.rx+(e.clientY-drag.y)/150))});
view.addEventListener('pointerup',()=>{drag=null;view.style.cursor=''});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){requestAnimationFrame(loop);
  if(wheel&&spin)wheel.rotation.z-=reduce?.002:.006;
  ry+=(tRy-ry)*.12;rx+=(tRx-rx)*.12;orbit.rotation.y=ry;orbit.rotation.x=rx;
  r.render(scene,cam)})();

syncUI();rebuild();
</script>

</body></html>
